
name: mobile
description: Aplicación móvil para la detección de microplásticos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  go_router: ^18.0.2
  image_picker: ^1.2.4
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  tflite_flutter: ^0.12.1
  image: ^4.12.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  web_socket_channel: ^3.0.3

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/best.tflite